name: Sync Fork with Upstream
on:
  schedule:
    - cron: '*/15 * * * *' 
  workflow_dispatch:     # Manuell auslösbar
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Lädt den gesamten Commit-Verlauf
      - name: Configure Git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
      - name: Sync upstream changes
        run: |
          git remote add upstream https://github.com/eurofurence/logistics-portal.git
          git fetch upstream

          # Synchronisiere main
          git checkout main
          git merge upstream/main
          git push origin main

          # Synchronisiere main-dev (explizit mit upstream/main-dev)
          git checkout -B main-dev upstream/main-dev
          git merge upstream/main-dev
          git push origin main-dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
